analysis:
  id: "2026"
  title: "Women's imprisonment rates by Police Force Area"
  data_release: "Criminal Justice Statistics, September 2026"
  publication_date: "2026-09-21"
  min_year: 2010
  max_year: 2025
  methodology_version: "2026.1"

sources:
  criminal_justice_statistics:
    url: "REPLACE_WITH_2026_RELEASE_URL"
    identifier: "cjs_2026"
  la_to_pfa_lookup:
    url: "REPLACE_WITH_2026_LOOKUP_URL"
    query:
      where: "1=1"
      outFields: "LAD25CD,LAD25NM,PFA25CD,PFA25NM"
      outSR: 4326
      f: "json"
  la_to_pfa_lookup_qa:
    url: "REPLACE_WITH_QA_LOOKUP_URL"
    query:
      where: "1=1"
      outFields: "LAD22CD,LAD22NM,PFA22CD,PFA22NM"
      outSR: 4326
      f: "json"

data:
  filenames:
    outcomes_by_offence: "sentence_outcomes_2017_2025.csv"
    outcomes_by_offence_earlier: "sentence_outcomes_2010_2016.csv"
    population: "LA_population_women_{min_year}-{max_year}.csv"
    la_to_pfa_lookup: "LA_to_PFA_2025_Lookup_in_EW.csv"
    la_to_pfa_lookup_qa: "LA_to_PFA_(December_2022)_Lookup_in_EW.csv"
    imprisonment_rates: "pfa_imprisonment_rates_{min_year}-{max_year}.csv"
    filter_sentence_type: "women_cust_comm_sus.csv"
    group_pfa_sentence_outcome: "women_cust_comm_sus_FINAL.csv"
    filter_sentence_length: "women_cust_sentence_len_FINAL.csv"
    make_custody_tables_template: "PFA_custodial_sentences_{category}_FINAL.csv"
    filter_custody_offences: "PFA_custodial_sentences_by_offence_{year}_FINAL.csv"
    la_to_pfa_matching: "LA_PFA_population_women_{min_year}-{max_year}.csv"
    custody_rate_pfa: "pfa_imprisonment_rates_{min_year}-{max_year}_publication_table.csv"
  qaFilenames:
    ons_comparator: "LA_population_women_{min_year}-{max_year}.csv"
    la_pfa: "QA_LA_PFA_population_women_{min_year}-{max_year}.csv"
  factsheetTests:
    custodial_sentences: "factsheet_custodial_sentences_{category}.csv"
    community_sentences: "factsheet_community_sentences.csv"

filters:
  sentence_type:
    include:
      sex:
        - "Female"
      outcome:
        - "Immediate Custody"
        - "Community Sentence"
        - "Suspended Sentence"
      age_group:
        - "Adults"
        - "Young adults"
    exclude:
      pfa:
        - "Not known"
    sort_by:
      - "year"
      - "pfa"

cleaning:
  sentence_type:
    regex_replacements:
      pfa:
        - ["Metropolitan", "London"]
      sex:
        - ['\d\d: ', ""]
      age_group:
        - ['\d\d: ', ""]
      offence:
        - ['\d\d: ', ""]
      specific_offence:
        - ['^[\dA-Za-z.-]+\s', ""]
      outcome:
        - ['\d\d: ', ""]
      sentence_len:
        - ['\d\d: ', ""]
        - ["Custody - ", ""]
        - ["Over", "More than"]
        - ["Life$", "Life sentence"]
  population:
    discard_geographies:
      - "regional"
      - "national"
    sex: "Females"
    minimum_age: 18
  categories:
    object_to_category_ratio: 0.05
  geography:
    excluded_la_codes:
      - "E10"
      - "E11"
    excluded_pfa_names:
      - "City of London"
    rename_pfa:
      "Devon & Cornwall": "Devon and Cornwall"

visualisation:
  output_format: "pdf"
  adjustments:
    custody_sentence_lengths: []
  paths:
    custody_sentence_lengths: "custody_sentence_lengths"
    sentence_types: "sentence_types"
    custody_offences: "custody_offences"